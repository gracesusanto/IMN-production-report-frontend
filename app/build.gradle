plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.jetpack.barcodescanner"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationId "com.jetpack.barcodescanner.dev"
            versionName "1.0-dev"
            resValue "string", "app_name", "IMN Dev"
            buildConfigField "String", "BACKEND_URL", '"http://192.168.1.152:8001"' // Wild Goose
        }
        trial {
            dimension "environment"
            applicationId "com.jetpack.barcodescanner.trial"
            versionName "1.0-trial"
            buildConfigField "String", "BACKEND_URL", '"http://192.168.0.218:8001"'
            resValue "string", "app_name", "IMN Trial"
        }
        prod {
            dimension "environment"
            applicationId "com.jetpack.barcodescanner"
            versionName "1.0"
            buildConfigField "String", "BACKEND_URL", '"http://192.168.0.218:8000"'
            resValue "string", "app_name", "IMN"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    namespace 'com.jetpack.barcodescanner'
}

dependencies {
    // Core / UI
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    // Compose (use BOM — no versions on Compose artifacts)
    implementation platform("androidx.compose:compose-bom:2024.10.00")
    androidTestImplementation platform("androidx.compose:compose-bom:2024.10.00")

    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.material:material-icons-extended"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // Networking / DataStore
    implementation "com.android.volley:volley:1.2.1"
    implementation "androidx.datastore:datastore-core:1.1.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // CameraX
    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ML Kit Barcode
    implementation "com.google.mlkit:barcode-scanning:17.3.0"

    // Permissions (Accompanist)
    implementation "com.google.accompanist:accompanist-permissions:0.32.0"

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.8.5"

    // Tests
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}